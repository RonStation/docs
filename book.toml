[book]
title = "RonStation documentation Wiki"
authors = ["Magelfik"]
language = "en"
description = "A collection of all documentation related to RonStation."

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
additional-css = ["assets/app.css"]
additional-js = ["assets/mermaid.min.js", "assets/mermaid-init.js"]
no-section-label = true
git-repository-url = "https://github.com/RonStation/docs"
git-repository-icon = "fab-github"

[output.html.fold]
enable = true
level = 1

[preprocessor]

[preprocessor.mermaid]
command = "mdbook-mermaid"
